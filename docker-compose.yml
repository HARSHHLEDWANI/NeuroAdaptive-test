services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neuro_db
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuro_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ./backend, target: runtime}
    command: ["alembic", "upgrade", "head"]
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/neuro_db
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: {context: ./backend, target: runtime}
    command: ["sh", "wait-for-db.sh"]
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/neuro_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports: ["8001:8000"]
    volumes: ["./backend:/app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: {context: ./backend, target: runtime}
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/neuro_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes: ["./backend:/app:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    env_file: [./frontend/.env.local]
    environment:
      NEXTAUTH_URL: http://localhost:3001
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: "true"
      INTERNAL_API_URL: http://backend:8000
    ports: ["3001:3000"]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
